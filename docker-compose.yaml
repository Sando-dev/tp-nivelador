services:
  server:
    ports:
      - 5678:5678
    build:
      context: ./services/server
      dockerfile: Dockerfile
    container_name: server
    environment:
      - PYTHONUNBUFFERED=1
      - SERVER_HOST=server
      - SERVER_PORT=5678

  client_0:
    volumes:
      - ./input:/app/input
      - ./output:/app/output
    build:
      context: ./services/client
      dockerfile: Dockerfile
    container_name: client_0
    depends_on:
      - server
    environment:
      - AGENCY_ID=0
      - SERVER_HOST=server
      - SERVER_PORT=5678
      - INPUT_FILE=/app/input/input-0.csv
      - OUTPUT_FILE=/app/output/output_0.csv
  
